[project]
name = "stxntx"
version = "0.1.0"
description = "NBA analytics for sticksandticks.com"
requires-python = ">=3.10"
dependencies = [
    "nba_api",
    "pbpstats",
    "duckdb",
    "pandas",
    "pyarrow",
    "plotly",
    "jupyter",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
